name: Supabase Health Check

on:
  schedule:
    # Daily at 03:00 UTC. GitHub cron is best-effort — expect delays of
    # minutes to a few hours, which is fine for a keep-alive ping.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY secret is not set"
            exit 1
          fi

          # Normalize: strip trailing slashes so "...supabase.co/" works too
          SUPABASE_URL="${SUPABASE_URL%/}"

          args=(
            -sS -o /dev/null -w "%{http_code}"
            --max-time 15
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"
          )

          case "$SUPABASE_PUBLISHABLE_KEY" in
            eyJ*)
              # Legacy JWT anon key: also send as Bearer token
              args+=(-H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}")
              ;;
            sb_publishable_*)
              # New publishable key: apikey header only
              ;;
            *)
              echo "::error::SUPABASE_PUBLISHABLE_KEY does not look like a valid key format"
              exit 1
              ;;
          esac

          status=$(curl "${args[@]}" "${SUPABASE_URL}/rest/v1/")

          echo "Supabase responded with HTTP ${status}"

          case "$status" in
            2*|3*)
              echo "Supabase is alive" ;;
            *)
              echo "::error::Supabase health check failed (HTTP ${status})"
              exit 1 ;;
          esac
